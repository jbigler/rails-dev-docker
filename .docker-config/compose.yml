services:
  rails:
    # Shared tag keyed by runtime versions: without it every compose project
    # names (and rebuilds) its own image per worktree.
    image: ${PROJECT_PREFIX}/rails:ruby${RUBY_VERSION}-node${NODE_VERSION}
    build:
      target: rails
      args:
        APP_USER_UID: ${UID:-1000}
        APP_GROUP_GID: ${GID:-1000}
        RUBY_VERSION: ${RUBY_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    stdin_open: true
    env_file: .env
    environment:
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT}
      DOMAIN: ${WORKTREE_HOST}
      GEM_VOLUME: ${GEM_VOLUME}
    deploy:
      resources:
        limits:
          cpus: "${CPUS_75:-4}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - dev
      - proxy
    # Traefik-routed hosts resolve to Traefik's static IP on the proxy
    # network — its host ports are loopback-bound, so host-gateway can't
    # reach them from a container.
    extra_hosts:
      - "${WORKTREE_HOST}:${TRAEFIK_IP:-10.213.0.2}"
      - "${S3_HOST}:${TRAEFIK_IP:-10.213.0.2}"
      - "${RUSTFS_UI_HOST}:${TRAEFIK_IP:-10.213.0.2}"
    # Loopback only — a remote debug session is arbitrary code execution.
    ports:
      - "127.0.0.1:${RUBY_DEBUG_PORT:-38698}:38698"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app.rule=Host(`${WORKTREE_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-app.entrypoints=web"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-app.loadbalancer.server.port=3000"
    volumes:
      - ../${CURRENT_WORKTREE_NAME}:/app
      - ${MAIN_WORKTREE_PATH}/.git:${MAIN_WORKTREE_PATH}/.git:ro
      - ../.docker-config/entrypoint-app.sh:/usr/local/bin/entrypoint-app.sh:ro
      - ../.docker-config/home:/home/appuser
      - shared_gems:/usr/local/bundle
      - node_modules:/app/node_modules
    entrypoint: ["entrypoint-app.sh"]
    command: ["bin/dev"]

  redis:
    image: redis:8-alpine
    networks:
      - dev
    # TCP on the `dev` network only — not published to the host. Reachable at
    # redis://redis:6379 (see REDIS_URL in .env).
    command: >
      redis-server
      --loglevel warning
      --save ''
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    # No env_file: .env — that file is written for the app containers and sets
    # PGHOST=db, which breaks the initdb.d scripts in here (during first-start
    # init the server listens on its local socket only, so createdb/psql get
    # "Connection refused"). Everything db actually needs is explicit below;
    # local connections authenticate as the container's own postgres OS user.
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:-password}
      # Match the app containers so timestamps agree across the stack.
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    # The parallel settings below fan a single query out across cores, which on
    # a test-suite run measures well past 200% CPU — cap it so one worktree's
    # Postgres can't starve the rest of the stack (or the other worktrees).
    deploy:
      resources:
        limits:
          cpus: "${CPUS_50:-4}"
    # Parallel query DSM segments come out of /dev/shm. The aggressive parallel
    # settings below (max_parallel_workers_per_gather=4, zeroed parallel costs)
    # make parallel plans routine, and Docker's 64mb default is too small —
    # exhaustion surfaces as "could not resize shared memory segment".
    shm_size: 256mb
    # Publish Postgres on a per-worktree host port so host-side `bin/rails`/`psql`
    # can reach this worktree's DB over TCP (bound to localhost only). Containers
    # reach it at db:5432 over the `dev` network (see PGHOST/PGPORT in .env).
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    networks:
      - dev
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../.docker-config/initdb/restore-dump.sh:/docker-entrypoint-initdb.d/restore-dump.sh:ro
      - ${DB_DUMP_DIR:-../.docker-config/db-dumps}:/db-dumps:ro
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track='all'
      -c max_connections=200
      -c max_locks_per_transaction=256
      -c shared_buffers=256MB
      -c temp_buffers=128MB
      -c work_mem=64MB
      -c maintenance_work_mem=256MB
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_wal_senders=0
      -c wal_level=minimal
      -c wal_compression=off
      -c checkpoint_timeout=1h
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c autovacuum=off
      -c random_page_cost=1.0
      -c seq_page_cost=0.1
      -c log_statement=none
      -c log_checkpoints=off
      -c log_autovacuum_min_duration=-1
      -c log_temp_files=-1
      -c max_parallel_workers_per_gather=4
      -c parallel_setup_cost=0
      -c parallel_tuple_cost=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  nvim:
    image: ${PROJECT_PREFIX}/nvim:ruby${RUBY_VERSION}-node${NODE_VERSION}
    build:
      target: nvim
      args:
        APP_USER_UID: ${UID:-1000}
        APP_GROUP_GID: ${GID:-1000}
        RUBY_VERSION: ${RUBY_VERSION}
        NODE_VERSION: ${NODE_VERSION}
    # Idle most of the time, but the language servers spike hard while indexing
    # the app after a checkout or a big rebase.
    deploy:
      resources:
        limits:
          cpus: "${CPUS_25:-2}"
    volumes:
      - ../.docker-config/home:/home/appuser
      - ${NVIM_CONFIG_DIR}:/home/appuser/.config/nvim:ro
      - ../${CURRENT_WORKTREE_NAME}:/app
      - ${MAIN_WORKTREE_PATH}/.git:${MAIN_WORKTREE_PATH}/.git
      - shared_gems:/usr/local/bundle
      - node_modules:/app/node_modules
      - ${SSH_PATH}:/home/appuser/.ssh:ro
      - ${SSH_AGENT_SOCK:-/dev/null}:/tmp/ssh-agent.sock:ro
      - ../.docker-config/entrypoint-nvim.sh:/usr/local/bin/entrypoint-nvim.sh:ro
      - ~/.config/git/ignore:/home/appuser/.config/git/ignore:ro
    tty: true
    stdin_open: true
    env_file: .env
    environment:
      GEM_VOLUME: ${GEM_VOLUME}
      # Host ssh-agent, forwarded via the socket mount above: git over SSH in
      # nvim/lazygit uses the already-unlocked host key instead of prompting for
      # the passphrase on every push/fetch.
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      RUSTFS_ENDPOINT: http://rustfs:9000
      DOMAIN: ${WORKTREE_HOST}
      WORKTREE_NAME: ${CURRENT_WORKTREE_NAME}
      # Light/dark mode for Neovim, detected from the host terminal by mise (see
      # .scripts/detect-terminal-background.sh). The headless nvim server has no
      # UI attached at startup, so Neovim's own OSC 11 detection never runs and it
      # would otherwise always come up dark. This is the value at container start;
      # the `mise run nvim` task re-pushes the current mode on every attach.
      NVIM_BACKGROUND: ${NVIM_BACKGROUND:-dark}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
    networks:
      - dev
    # Loopback only — nvim RPC allows arbitrary command execution.
    ports:
      - "127.0.0.1:${NVIM_PORT:-7777}:7777"
    entrypoint: ["entrypoint-nvim.sh"]
    command: ["/usr/local/bin/nvim", "--headless", "--listen", "0.0.0.0:7777"]

  playwright:
    # Tag keyed by the Playwright version this worktree's Gemfile.lock pins —
    # a gem bump rebuilds the matching server image on the next `up`.
    image: ${PROJECT_PREFIX}/playwright:v${PLAYWRIGHT_VERSION:-1.60.0}
    build:
      context: .
      dockerfile: Dockerfile.playwright
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.60.0}
    shm_size: "1gb"
    init: true
    deploy:
      resources:
        limits:
          cpus: "${CPUS_25:-2}"
    # Expose the browser server to the host (loopback only) so system tests run
    # ON THE HOST can connect to this containerized browser. Port is per-worktree.
    ports:
      - "127.0.0.1:${PLAYWRIGHT_HOST_PORT:-18888}:8888"
    environment:
      HEADLESS_SYSTEM_TESTS: ${HEADLESS_SYSTEM_TESTS:-0}
      # Target of the entrypoint's loopback :80 shim for *.localhost hosts.
      TRAEFIK_IP: ${TRAEFIK_IP:-10.213.0.2}
    networks:
      - dev
      - proxy
    # See the rails service — Traefik-routed hosts via its static proxy-net IP.
    extra_hosts:
      - "${WORKTREE_HOST}:${TRAEFIK_IP:-10.213.0.2}"
      - "${S3_HOST}:${TRAEFIK_IP:-10.213.0.2}"
      - "${RUSTFS_UI_HOST}:${TRAEFIK_IP:-10.213.0.2}"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../.docker-config/entrypoint-playwright.sh:/usr/local/bin/entrypoint-playwright.sh:ro
      - ../.docker-config/init-firewall-playwright.sh:/usr/local/bin/init-firewall-playwright.sh:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vnc.rule=Host(`vnc.${WORKTREE_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vnc.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-vnc.service=${COMPOSE_PROJECT_NAME}-vnc"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-vnc.loadbalancer.server.port=8080"
    entrypoint: ["entrypoint-playwright.sh"]

  rustfs-init:
    image: alpine
    volumes:
      - rustfs_data:/data
      - ${DB_DUMP_DIR:-../.docker-config/db-dumps}:/db-dumps:ro
    command: >
      sh -c '
        if [ -f /db-dumps/rustfs_data.tar.gz ] && [ ! -d /data/rustfs0 ]; then
          echo "rustfs-init: Restoring RustFS data from backup..."
          tar xzf /db-dumps/rustfs_data.tar.gz -C /data
          echo "rustfs-init: Done."
        else
          echo "rustfs-init: No restore needed."
        fi
      '
    networks:
      - dev

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.83
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0..3} # Define 4 storage volumes
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
    # Near-idle at rest; erasure-codes across its 4 volumes on every upload.
    deploy:
      resources:
        limits:
          cpus: "${CPUS_25:-2}"
    volumes:
      - rustfs_data:/data
    networks:
      - dev
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3.rule=Host(`${S3_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3.service=${COMPOSE_PROJECT_NAME}-s3"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-s3.loadbalancer.server.port=9000"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3-ui.rule=Host(`${RUSTFS_UI_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3-ui.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3-ui.service=${COMPOSE_PROJECT_NAME}-s3-ui"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-s3-ui.loadbalancer.server.port=9001"
      # RustFS serves the console at /rustfs/console/index.html; a bare `/` on
      # port 9001 falls through to the S3 API handler and answers 403
      # AccessDenied (unsigned request). Redirect the host root to the console.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-s3-ui.middlewares=${COMPOSE_PROJECT_NAME}-s3-ui-root"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-s3-ui-root.redirectregex.regex=^http://([^/]+)/?$$"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME}-s3-ui-root.redirectregex.replacement=http://$${1}/rustfs/console/index.html"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  claude:
    image: ${PROJECT_PREFIX}/claude:latest
    build:
      target: claude
      args:
        APP_USER_UID: ${UID:-1000}
        APP_GROUP_GID: ${GID:-1000}
        RUBY_VERSION: ${RUBY_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        CLAUDE_CODE_VERSION: "latest"
        GIT_DELTA_VERSION: "0.19.2"
    deploy:
      resources:
        limits:
          cpus: "${CPUS_50:-4}"
    volumes:
      - ../.docker-config/home:/home/appuser
      # Worktree-specific mount point: ~/.claude/projects keys sessions by
      # path and the home dir is shared by every worktree's claude container,
      # so a common /app would intermix session/resume history across worktrees.
      - ../${CURRENT_WORKTREE_NAME}:/app-${CURRENT_WORKTREE_NAME}
      - ../.docker-config/CLAUDE.md:/opt/claude/CLAUDE.md:ro
      # Mounted, not baked into the image (repo convention): script edits
      # take effect on the next `run` without an image rebuild.
      - ../.docker-config/entrypoint-claude.sh:/usr/local/bin/entrypoint-claude.sh:ro
      - ../.docker-config/init-firewall.sh:/usr/local/bin/init-firewall.sh:ro
      # Session-state drop zone for the wt.localhost dashboard badge — the
      # status hook writes /status/<worktree>.json, the proxy's home
      # container serves the same directory read-only.
      - ../.docker-config/claude-status-hook.sh:/usr/local/bin/claude-status-hook.sh:ro
      - ../.docker-config/status:/status
      - ${MAIN_WORKTREE_PATH}/.git:${MAIN_WORKTREE_PATH}/.git
      - shared_gems:/usr/local/bundle
      - node_modules:/app-${CURRENT_WORKTREE_NAME}/node_modules
      - ${SSH_PATH}:/home/appuser/.ssh:ro
      - ${SSH_AGENT_SOCK:-/dev/null}:/tmp/ssh-agent.sock:ro
      - ~/.config/git/ignore:/home/appuser/.config/git/ignore:ro
    working_dir: /app-${CURRENT_WORKTREE_NAME}
    tty: true
    stdin_open: true
    env_file: .env
    environment:
      GEM_VOLUME: ${GEM_VOLUME}
      NODE_OPTIONS: "--max-old-space-size=4096"
      # Per-worktree, not the shared ~/.claude: Claude caches credentials in
      # memory and the OAuth refresh rotates the refresh token, so containers
      # sharing one .credentials.json invalidate each other and force a daily
      # re-login. The entrypoint symlinks the genuinely global pieces back.
      CLAUDE_CONFIG_DIR: "/home/appuser/.claude-worktrees/${CURRENT_WORKTREE_NAME}"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      SSH_AUTH_SOCK: /tmp/ssh-agent.sock
      RUSTFS_ENDPOINT: http://rustfs:9000
      DOMAIN: ${WORKTREE_HOST}
      WORKTREE_NAME: ${CURRENT_WORKTREE_NAME}
    profiles: ["do_not_start"]
    networks:
      - dev
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: ["entrypoint-claude.sh"]

volumes:
  home:
  db_data:
  rustfs_data:
  # Per-worktree (compose prefixes the project name): a single volume shared
  # across worktrees let diverging lockfiles clobber each other and concurrent
  # boots race in `npm install`. Installs stay fast via the npm cache in the
  # shared /home/appuser bind mount (~/.npm).
  node_modules:
  shared_gems:
    external: true
    name: ${GEM_VOLUME:-shared_gems}

networks:
  dev:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400 # Fix for access when wireguard VPN is on host
  proxy:
    external: true
    name: ${PROJECT_PREFIX}_proxy
