# Serves the wt.localhost dashboard plus the claude session-status drop zone.
# /status/ autoindexes as JSON so the dashboard can discover which worktrees
# have (or had) a claude session without knowing the slugs up front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /status/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }
}
