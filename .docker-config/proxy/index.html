<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base target="_blank" />
    <title>Worktrees</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      body {
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
        opacity: 0.7;
        font-weight: 500;
      }
      .status {
        font-size: 0.75rem;
        opacity: 0.5;
        font-family: ui-monospace, monospace;
      }
      .worktree {
        border: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        border-radius: 8px;
        padding: 0.875rem 1rem;
        margin-bottom: 0.625rem;
      }
      .worktree h2 {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-weight: 500;
      }
      /* Both this and .claude-status claim the free space; whichever renders
         first wins it, so the pair stays right-aligned with or without a badge. */
      .rtk {
        margin-left: auto;
        font-size: 0.7rem;
        font-weight: 400;
        opacity: 0.5;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .claude-status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 0.7rem;
        font-weight: 400;
        opacity: 0.75;
      }
      .claude-status .dot {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
      }
      .claude-status.working .dot {
        background: #16a34a;
      }
      .claude-status.waiting .dot {
        background: #d97706;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      .links {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .links a {
        padding: 0.25rem 0.75rem;
        border-radius: 6px;
        background: color-mix(in srgb, currentColor 8%, transparent);
        text-decoration: none;
        font-size: 0.8125rem;
        color: inherit;
        transition: background 0.1s;
      }
      .links a:hover {
        background: color-mix(in srgb, currentColor 18%, transparent);
      }
      .links a.primary {
        background: color-mix(in srgb, CanvasText 85%, transparent);
        color: Canvas;
      }
      .links a.primary:hover {
        background: CanvasText;
      }
      .empty {
        opacity: 0.55;
        text-align: center;
        padding: 3rem 1rem;
        font-style: italic;
      }
      .status a {
        color: inherit;
        text-decoration: none;
      }
      .status a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Worktrees</h1>
      <div class="status">
        <a href="http://logs.localhost">logs</a> · <span id="status"></span>
      </div>
    </header>
    <div id="worktrees"></div>
    <script>
      const LABELS = {
        app: "app",
        email: "email",
        lookbook: "lookbook",
        routes: "routes",
        vnc: "vnc chrome",
        "s3 console": "s3 console",
      };
      const ORDER = ["app", "email", "lookbook", "routes", "vnc", "s3 console"];

      function extractHost(rule) {
        const m = rule.match(/Host\(`([^`]+)`\)/);
        return m ? m[1] : null;
      }

      function classify(host) {
        if (host.startsWith("s3-ui."))
          return {
            name: host.slice(6).replace(/\.localhost$/, ""),
            kind: "s3 console",
          };
        if (host.startsWith("s3.")) return null;
        if (host.startsWith("vnc."))
          return {
            name: host.slice(4).replace(/\.localhost$/, ""),
            kind: "vnc",
          };
        if (host === "wt.localhost" || host === "logs.localhost") return null;
        return { name: host.replace(/\.localhost$/, ""), kind: "app" };
      }

      // Claude session states written by each worktree's status hook
      // (claude-status-hook.sh) into .docker-config/status/, served here
      // at /status/ with a JSON autoindex.
      async function loadClaudeStatuses() {
        try {
          const listing = await fetch("/status/").then((r) => r.json());
          const entries = await Promise.all(
            listing
              .filter((f) => /^[^.].*\.json$/.test(f.name))
              .map(async (f) => {
                const s = await fetch(`/status/${f.name}`).then((r) =>
                  r.json(),
                );
                return [f.name.replace(/\.json$/, ""), s];
              }),
          );
          return Object.fromEntries(entries);
        } catch {
          return {};
        }
      }

      function ago(ts) {
        const s = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 1e3));
        if (s < 60) return `${s}s`;
        if (s < 3600) return `${Math.round(s / 60)}m`;
        return `${Math.round(s / 3600)}h`;
      }

      function claudeBadge(status) {
        if (!status || status.state === "offline") return "";
        const label = status.state === "working" ? "claude working" : "claude waiting";
        return `<span class="claude-status ${status.state}"><span class="dot"></span>${label} · ${ago(status.ts)}</span>`;
      }

      function tokens(n) {
        if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
        if (n >= 1e3) return `${(n / 1e3).toFixed(1)}K`;
        return `${n}`;
      }

      // RTK token savings, written into the same status file by
      // claude-status-hook.sh (`rtk gain --format json`, .summary).
      function rtkChip(status) {
        const r = status && status.rtk;
        if (!r || !r.total_commands) return "";
        const title = `${r.total_commands} rtk commands · ${tokens(r.total_input)} raw → ${tokens(r.total_output)} filtered`;
        return `<span class="rtk" title="${title}">rtk ${tokens(r.total_saved)} saved · ${Math.round(r.avg_savings_pct)}%</span>`;
      }

      async function load() {
        const status = document.getElementById("status");
        const container = document.getElementById("worktrees");
        let routers, claude;
        try {
          [routers, claude] = await Promise.all([
            fetch("/api/http/routers").then((r) => r.json()),
            loadClaudeStatuses(),
          ]);
        } catch (e) {
          container.innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
          return;
        }

        const worktrees = {};
        for (const r of routers) {
          if (r.provider !== "docker") continue;
          if (r.status !== "enabled") continue;
          const host = extractHost(r.rule);
          if (!host) continue;
          const c = classify(host);
          if (!c) continue;
          if (!worktrees[c.name]) worktrees[c.name] = {};
          if (c.kind === "vnc") {
            // Separate host served by the playwright container's noVNC bridge; deep-link
            // straight into the viewer so the browser shows the live test run.
            worktrees[c.name].vnc =
              `http://${host}/vnc.html?path=websockify&autoconnect=1&reconnect=1&reconnect_delay=2000&resize=scale`;
          } else {
            worktrees[c.name][c.kind] = `http://${host}`;
          }
          if (c.kind === "app") {
            worktrees[c.name].email = `http://${host}/letter_opener`;
            worktrees[c.name].lookbook = `http://${host}/lookbook`;
            worktrees[c.name].routes = `http://${host}/rails/info/routes`;
          }
        }

        // A claude session can run while the worktree's app stack is down —
        // still show a card for it (badge only, no links).
        for (const name of Object.keys(claude)) {
          if (claude[name].state !== "offline" && !worktrees[name])
            worktrees[name] = {};
        }

        const sorted = Object.entries(worktrees).sort(([a], [b]) =>
          a.localeCompare(b),
        );
        if (sorted.length === 0) {
          container.innerHTML =
            '<div class="empty">No worktrees running. Start one with <code>mise run up</code>.</div>';
        } else {
          container.innerHTML = sorted
            .map(([name, urls]) => {
              const links = ORDER.filter((k) => urls[k])
                .map(
                  (k, i) =>
                    `<a href="${urls[k]}" class="${i === 0 ? "primary" : ""}">${LABELS[k]}</a>`,
                )
                .join("");
              return `<div class="worktree"><h2>${name}${claudeBadge(claude[name])}${rtkChip(claude[name])}</h2><div class="links">${links}</div></div>`;
            })
            .join("");
        }

        status.textContent = new Date().toLocaleTimeString();
      }

      load();
      setInterval(load, 5000);
    </script>
  </body>
</html>
