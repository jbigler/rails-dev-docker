[env]
UID = "{{exec(command='id -u')}}"
GID = "{{exec(command='id -g')}}"
PROJECT_PREFIX = "{{env.PROJECT_PREFIX | default(value='default')}}"
GEM_VOLUME_BASE = "{{env.GEM_VOLUME_BASE | default(value='default_shared_gems')}}"
SSH_PATH = "{{ env.SSH_PATH | default(value = env.HOME ~ '/.ssh') }}"
# Host ssh-agent socket bind-mounted into the nvim/claude containers, so git
# over SSH uses the already-unlocked host key instead of prompting for the
# passphrase every time. Rootless podman maps the host user onto uid 1000 in
# the container (keep-id), so the socket's ownership works as-is.
# Falls back to /dev/null when no agent is running — mounting that keeps the
# containers startable (ssh just reports no agent) rather than failing the unit,
# which podman does outright on a bind source that is not there. units:env
# re-checks the path at generation time, because a *stale* $SSH_AUTH_SOCK points
# at a socket that no longer exists and would fail the same way.
# Linux only: the old macOS value was a Docker Desktop VM path.
SSH_AGENT_SOCK = "{{ env.SSH_AUTH_SOCK | default(value='/dev/null') }}"
# Proxy network subnet and Traefik's static IP on it (the worktree --add-host
# target). Override in mise.local.toml when running multiple PROJECT_PREFIX
# workspaces, or the second proxy network fails to create -- netavark refuses a
# subnet already in use on the host. These are the PODMAN_ names quadlet.sh
# actually reads; the old PROXY_SUBNET/TRAEFIK_IP pair was left behind by the
# conversion and silently ignored.
PODMAN_PROXY_SUBNET = "{{env.PODMAN_PROXY_SUBNET | default(value='10.214.0.0/24')}}"
PODMAN_PROXY_IP_RANGE = "{{env.PODMAN_PROXY_IP_RANGE | default(value='10.214.0.128/25')}}"
PODMAN_TRAEFIK_IP = "{{env.PODMAN_TRAEFIK_IP | default(value='10.214.0.2')}}"
NVIM_CONFIG_DIR = "{{ env.NVIM_CONFIG_DIR | default(value = env.HOME ~ '/.config/nvim') }}"
# Light/dark mode for the nvim container, read by the Neovim config at startup.
# The container's `nvim --headless --listen` server has no UI attached when it
# starts, so Neovim's builtin OSC 11 background detection is skipped and it would
# otherwise always come up dark. Detected from the host terminal instead; set
# NVIM_BACKGROUND in the environment or mise.local.toml to override.
NVIM_BACKGROUND = "{{ exec(command = config_root ~ '/.scripts/detect-terminal-background.sh') }}"
# CPU limits for the containers (PodmanArgs=--cpus in the unit templates), as a percentage of
# this machine's cores instead of hardcoded counts — see .scripts/cpu-share.sh.
# Several worktree stacks can be up at once, so no service gets the whole host;
# override these in mise.local.toml to change the split.
CPUS_75 = "{{ exec(command = config_root ~ '/.scripts/cpu-share.sh 75') }}"
CPUS_50 = "{{ exec(command = config_root ~ '/.scripts/cpu-share.sh 50') }}"
CPUS_25 = "{{ exec(command = config_root ~ '/.scripts/cpu-share.sh 25') }}"

[tasks.nvim]
description = "Connect to Neovim in the container."
# No command preview — this task hands the terminal straight to the Neovim UI.
quiet = true
# No `depends = ["up"]` and no readiness polling: the `up` dependency added
# seconds to every attach. This assumes the nvim container is already running —
# if it isn't, `mise run up` first.
#
# NVIM_BACKGROUND is baked into the container's environment when it starts, so a
# server that has been up since before an OS theme flip is stale. Push the
# freshly detected mode in before attaching — mise re-runs the detector on every
# invocation, so this value is current. Best effort: if the server isn't up yet
# the --remote-ui below reports it properly.
# KITTY_LISTEN_ON/KITTY_WINDOW_ID get the same treatment, for
# vim-kitty-navigator's `kitten @` calls. Both are per-attach values the server
# cannot inherit: the socket name carries the kitty PID, and the window id
# differs for every kitty window you attach from. KITTY_WINDOW_ID is not
# optional — KittyIsInStackLayout() interpolates it into `ls --match id:` and
# json_decode throws on the empty match, on every navigation keypress.
# The host path is rewritten to the container's mount point (/kitty-sock). The
# unix:/* guard skips kitty instances still on an abstract socket (unix:@…),
# which cannot be mounted — those windows simply get no kitty integration.
#
# set-user-vars has to be re-issued here, not left to the plugin: it fires the
# call once at plugin load, long before this attach supplies the socket, and
# kitty gates the ctrl+h/j/k/l pass-through on that var (see the
# `map --when-focus-on var:IS_VIM=true` block in kitty.conf). Without it kitty
# keeps its own binding and the keys never reach nvim's splits. The matching
# IS_VIM=false after --remote-ui returns covers detach: the plugin's own
# VimLeavePre/VimSuspend hooks only fire when the server exits, and the server
# outlives the UI here.
# (Comments live out here, not inside `run`: mise echoes the script's first line
# as the command preview, so a leading comment is all you'd see.)
run = """
  if [ -n "${NVIM_BACKGROUND:-}" ]; then
    nvim --server localhost:{{ env.NVIM_PORT }} \
      --remote-expr "v:lua.BackgroundSet('$NVIM_BACKGROUND')" >/dev/null 2>&1 || true
  fi
  kitty_attached=
  case "${KITTY_LISTEN_ON:-}" in unix:/*)
    kitty_sock="/kitty-sock/$(basename "${KITTY_LISTEN_ON#unix:}")"
    nvim --server localhost:{{ env.NVIM_PORT }} \
      --remote-expr "[setenv('KITTY_LISTEN_ON', 'unix:$kitty_sock'), setenv('KITTY_WINDOW_ID', '${KITTY_WINDOW_ID:-}'), system(['kitten', '@', 'set-user-vars', 'IS_VIM=true'])]" >/dev/null 2>&1 && kitty_attached=1
    ;;
  esac
  nvim --remote-ui --server localhost:{{ env.NVIM_PORT }}
  if [ -n "$kitty_attached" ]; then
    nvim --server localhost:{{ env.NVIM_PORT }} \
      --remote-expr "system(['kitten', '@', 'set-user-vars', 'IS_VIM=false'])" >/dev/null 2>&1 || true
  fi
"""
alias = "v"

[tasks.rails]
description = "Shell into the running Rails container for this worktree."
run = "{{config_root}}/.scripts/podman-wt.sh exec /bin/zsh"

[tasks.test]
description = "Run the full local test suite: Rails unit tests then the JavaScript tests. System tests are not included — run 'test:rails_system' for those."
# Not `depends` — mise runs dependencies in parallel, which interleaves the two
# suites' output. An array `run` is sequential and stops at the first failure.
run = [
  "mise run test:rails",
  "mise run test:javascript",
]
alias = "t"

[tasks."test:rails"]
description = "Run the Rails unit tests. Pass any 'rails test' args (files, file:line, -n, --seed, ...) to run a subset."
depends = ["up", "log:trim"]
# Sibling deps run in parallel, which puts mise in prefixed-output mode: it pipes
# stdio and prefixes whole lines (one dep, or a serial chain, keeps the terminal).
# Minitest's progress dots carry no newline, so they sit in the buffer until the
# final summary. `raw` hands the terminal through and they stream as they run.
raw = true
usage = 'arg "[args]" var=#true help="args forwarded to bin/rails test (e.g. test/models/foo.rb:42, -n /pattern/, --seed 123)"'
run = "{{config_root}}/.scripts/podman-wt.sh exec bin/rails test $usage_args"
alias = "tr"

[tasks."test:rails_watcher"]
description = "Start the Retest runner — reruns the matching Rails test on every file save."
depends = ["up", "log:trim"]
# The parallel sibling deps put mise in prefixed-output mode (see `test:rails`),
# which pipes stdio and kills the TTY podman's -it needs. `raw` hands the
# terminal straight to the container.
raw = true
# EXEC_FRESH: never `podman exec` here. Quitting the watcher would take the rails
# container down with it, so this always gets its own throwaway container --
# which cmd_exec labels traefik.enable=false, so Traefik does not round-robin
# the worktree host onto a container that is not serving :3000.
run = """
  CMD='gem list -i retest > /dev/null 2>&1 || gem install retest && retest --rails'
  EXEC_FRESH=1 EXEC_ENV=DISABLE_COVERAGE=true \
    {{config_root}}/.scripts/podman-wt.sh exec sh -c "$CMD"
"""
alias = "trw"

[tasks."test:javascript"]
description = "Run the JavaScript (Vitest) tests once. Pass a file path or any vitest args (-t 'name', --reporter, ...) to run a subset."
usage = 'arg "[args]" var=#true help="args forwarded to vitest run (e.g. test/javascript/controllers/foo_controller.test.js, -t sums-the-inputs)"'
run = "{{config_root}}/.scripts/podman-wt.sh exec npx vitest run $usage_args"
alias = "tj"

[tasks."test:javascript_watcher"]
description = "Start Vitest in watch mode — the JS TDD loop. Pass a file path or vitest args to narrow what it watches."
usage = 'arg "[args]" var=#true help="args forwarded to vitest (e.g. test/javascript/controllers/foo_controller.test.js)"'
run = "{{config_root}}/.scripts/podman-wt.sh exec npx vitest $usage_args"
alias = "tjw"

[tasks.ci]
description = "Run the CI linting and tests."
# EXEC_FRESH: its own container, as the compose version used `run` rather than
# `exec` -- a ci run should not share a process space with the dev server.
run = """
  EXEC_FRESH=1 {{config_root}}/.scripts/podman-wt.sh exec bundle exec rake ci:build:commit
"""

[tasks.wt]
description = "Create a worktree: mise run wt <branch|PR#|new-branch-name>"
usage = 'arg "<branch>" help="existing branch name, PR number, or new branch name"'
run = '{{config_root}}/.scripts/create-worktree.sh "$usage_branch"'

[tasks."wt:ls"]
description = "List all worktrees"
run = "{{config_root}}/.scripts/list-worktrees.sh"

[tasks."wt:open"]
description = "Open the current worktree URL in a browser. Pass a browser binary name (e.g. firefox) to override xdg-open."
usage = 'arg "[browser]" help="optional browser binary; defaults to xdg-open"'
run = """
  url="http://${WORKTREE_HOST}"
  browser="${usage_browser:-}"
  if [ -n "$browser" ]; then
    if ! command -v "$browser" >/dev/null 2>&1; then
      echo "Error: '$browser' not found in PATH" >&2
      exit 1
    fi
    exec "$browser" "$url"
  fi
  if ! command -v xdg-open >/dev/null 2>&1; then
    echo "xdg-open not found. Pass a browser binary: mise run wt:open firefox" >&2
    exit 1
  fi
  exec xdg-open "$url"
"""

[tasks."log:trim"]
description = "Truncate any worktree log over 100 MB. log/test.log is appended by every test run and never rotated."
# Truncate, not delete: a container may hold the file open, and unlinking it
# would leave the writer filling an inode nothing can see. Sweeps every
# worktree, so a stale one you no longer test still gets reclaimed.
run = "find {{config_root}}/*/log -maxdepth 1 -name '*.log' -size +100M -exec truncate -s 0 {} + 2>/dev/null || true"

[tasks."wt:share"]
description = "Expose this worktree (app + S3) over the tailnet for phone testing. One worktree at a time."
run = '{{config_root}}/.scripts/share-worktree.sh on'

[tasks."wt:unshare"]
description = "Stop sharing this worktree over the tailnet."
run = '{{config_root}}/.scripts/share-worktree.sh off'

[tasks.claude]
description = "Run Claude AI assistant in the current terminal window. Set CLAUDE_NEW_TERM=1 (or run claude:newterm) to open it in a new terminal tab instead."
usage = 'arg "[args]…" var=#true default=""'
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  set -- $args
  # podman-claude.sh seeds the home, starts rails and playwright, and reads
  # CLAUDE_NO_TOKEN itself -- so unlike the compose version there is no
  # -e flag list to assemble here.
  case "${CLAUDE_NEW_TERM:-}" in
    ""|0|false|no) exec {{config_root}}/.scripts/podman-claude.sh "$@" ;;
  esac
  exec {{config_root}}/.scripts/claude-newterm.sh "$@"
"""
alias = "ai"

[tasks."claude:notoken"]
description = "Run Claude without CLAUDE_CODE_OAUTH_TOKEN in the container — the session uses this worktree home's own login, and prompts for /login when the home has none. Credentials are left alone, so you can switch back to the token with `mise run claude`."
usage = 'arg "[args]…" var=#true default=""'
env = { CLAUDE_NO_TOKEN = "1" }
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  exec mise run claude $args
"""
alias = "ai:notoken"

[tasks."claude:notoken:newterm"]
description = "claude:notoken in a new tab of the current terminal."
usage = 'arg "[args]…" var=#true default=""'
env = { CLAUDE_NO_TOKEN = "1", CLAUDE_NEW_TERM = "1" }
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  exec mise run claude $args
"""
alias = "ai:notoken:newterm"

[tasks."claude:rebuild"]
description = "Rebuild the Claude image with the latest Claude Code version, busting the layer cache so it actually re-fetches."
# UPDATE_CLAUDE_CODE is an ARG in the Dockerfile whose only purpose is to
# invalidate the layer that installs Claude Code; the value is never read.
run = "UPDATE_CLAUDE_CODE=$(date +%s) {{config_root}}/.scripts/podman-build.sh claude"

[tasks."claude:template:promote"]
description = "Promote this worktree's Claude config set (agents, hooks, skills, settings, plugin records) to the template that seeds new worktrees. Merges plugin records unless --replace; pass a worktree name to promote another worktree."
usage = 'arg "[args]…" var=#true default=""'
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  set -- $args
  case "${1:-}" in
    ""|-*) set -- "$CURRENT_WORKTREE_NAME" "$@" ;;
  esac
  exec {{config_root}}/.scripts/sync-claude-template.sh promote "$@"
"""

[tasks."claude:template:apply"]
description = "Copy the template's Claude config set onto this worktree's home (or --all for every home). Never touches credentials, sessions or other state."
usage = 'arg "[args]…" var=#true default=""'
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  set -- $args
  case "${1:-}" in
    ""|-*) set -- "$CURRENT_WORKTREE_NAME" "$@" ;;
  esac
  case "$*" in
    *--all*) set -- --all $(printf '%s\\n' "$@" | grep -v -e "^$CURRENT_WORKTREE_NAME$" -e "^--all$" | tr '\\n' ' ') ;;
  esac
  exec {{config_root}}/.scripts/sync-claude-template.sh apply "$@"
"""

[tasks.clean]
description = "Remove podman containers, networks, volumes and image tags belonging to worktrees that no longer exist. Lists what it found and asks before deleting. Leaves live worktrees and the shared base images alone."
run = "{{config_root}}/.scripts/clean-orphan-podman-artifacts.sh"

[tasks.destroy]
description = "Remove all podman resources (containers, networks, volumes, images) for this project, the rendered systemd units, and the project folder."
run = "{{config_root}}/.scripts/podman-destroy.sh"

[tasks.doctor]
description = "Check the rootless podman prerequisites: version, socket, privileged-port sysctl, linger."
run = "{{config_root}}/.scripts/quadlet.sh doctor"

[tasks."units:install"]
description = "Render .container-config/quadlet/ into ~/.config/containers/systemd and reload systemd."
run = "{{config_root}}/.scripts/quadlet.sh install"

[tasks."units:uninstall"]
description = "Remove the rendered Quadlet units and reload systemd."
run = "{{config_root}}/.scripts/quadlet.sh uninstall"

[tasks."verify:spike"]
description = "Prove Traefik-on-podman discovers and routes to a podman container. Throwaway; needs units:install first."
run = "{{config_root}}/.scripts/quadlet.sh spike"

[tasks.allow-ports]
description = "Lower net.ipv4.ip_unprivileged_port_start to 80 so rootless podman can publish Traefik's :80. Needs sudo once."
run = "{{config_root}}/.scripts/quadlet.sh allow-ports"

[tasks."config:init"]
description = "Create the workspace-root mise.local.toml if missing (prompts for the project name, defaulting to the folder name)."
run = "{{config_root}}/.scripts/local-config.sh"

[tasks."proxy:up"]
description = "Start the podman proxy stack (traefik, dozzle, dashboard). Worktree units pull it in automatically, so this is for using the dashboard without a worktree running."
run = "{{config_root}}/.scripts/quadlet.sh proxy-up"

[tasks."proxy:down"]
description = "Stop the podman proxy stack and its network."
run = "{{config_root}}/.scripts/quadlet.sh proxy-down"

[tasks."proxy:restart"]
description = "Restart the podman proxy stack, recreating its containers."
run = "{{config_root}}/.scripts/quadlet.sh proxy-restart"

[tasks."proxy:logs"]
description = "Follow a proxy service's journal (default traefik; e.g. `mise run proxy:logs dozzle`)."
run = "{{config_root}}/.scripts/quadlet.sh proxy-logs"

[tasks."proxy:pull"]
description = "Pull updated traefik, dozzle and nginx images and recreate the proxy stack with them."
run = "{{config_root}}/.scripts/quadlet.sh proxy-pull"

[tasks.verify]
description = "Check that Traefik actually discovered the proxy containers over the podman socket, and that routing works end to end."
run = "{{config_root}}/.scripts/quadlet.sh verify"

[tasks."units:env"]
description = "Write this worktree's unit env file (.units/<name>.env in the workspace root), the per-worktree values the Quadlet templates read. Rerun after a ruby/node/playwright bump. Run from a worktree."
run = "{{config_root}}/.scripts/units-env.sh"

[tasks.build]
description = "Build the rails, nvim, claude and playwright images under podman. Pass --pull to re-fetch the base FROM layers. Run from a worktree."
run = "{{config_root}}/.scripts/podman-build.sh"
alias = "b"

[tasks.up]
description = "Start this worktree's stack. Starts rails; systemd pulls in the network, db, redis, rustfs and the proxy. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh up"
alias = "u"

[tasks.stop]
description = "Stop this worktree's containers without removing volumes. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh stop"
alias = "s"

[tasks.down]
description = "Stop this worktree's containers AND delete its db, rustfs and node_modules volumes. Prompts first, defaulting to No. Shared volumes are kept. Run from a worktree."
# No mise `confirm` here: the script asks, so that a direct invocation is
# guarded too, and so there is exactly one prompt rather than two.
run = "{{config_root}}/.scripts/podman-wt.sh down"

[tasks.restart]
description = "Restart this worktree's rails service, recreating the container. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh restart"

[tasks.status]
description = "Show this worktree's unit and container state plus its URLs. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh status"

[tasks.logs]
description = "Follow a service's journal for this worktree (default rails; e.g. `mise run logs db`). Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh logs"

[tasks.exec]
description = "Run a command in this worktree's rails container, or a transient one if the stack is down. Defaults to a shell. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh exec"

[tasks.console]
description = "Rails console for this worktree. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh exec bin/rails console"
alias = "c"

[tasks."test:rails_system"]
description = "Run system tests, ensuring playwright is up first. Does not stop it afterwards -- a Claude session in the claude container may be using the same browser server. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh test:system"
alias = "trs"

[tasks.init]
description = "Clone the Rails app into a default-branch-named folder as the base worktree (ID 0), write ports.registry and render its mise.local.toml. Usage: mise run init <user/repo | git-url>"
run = "{{config_root}}/.scripts/init-repo.sh"

[tasks."proxy:status"]
description = "Show the proxy stack's unit and container state plus its URLs."
run = "{{config_root}}/.scripts/quadlet.sh proxy-status"
[tasks."db:dump"]
description = "Dump this worktree's development database and RustFS objects into .container-config/db-dumps/. They restore automatically on the next up against an empty db volume. Run from a worktree."
run = "{{config_root}}/.scripts/podman-db-dump.sh"

[tasks."db:dump:clear"]
description = "Remove the dump files, so the next up on an empty db volume runs a full db:prepare instead of restoring."
run = "{{config_root}}/.scripts/podman-db-dump.sh clear"

[tasks.pull]
description = "Refresh the third-party images (postgres, redis, rustfs). The rails/nvim/claude/playwright images are built locally and never pushed, so they are deliberately excluded -- pulling them would fail on localhost/. Run from a worktree."
run = "{{config_root}}/.scripts/podman-wt.sh pull"
alias = "p"

