[env]
UID = "{{exec(command='id -u')}}"
GID = "{{exec(command='id -g')}}"
PROJECT_PREFIX = "{{env.PROJECT_PREFIX | default(value='default')}}"
GEM_VOLUME_BASE = "{{env.GEM_VOLUME_BASE | default(value='default_shared_gems')}}"
SSH_PATH = "{{ env.SSH_PATH | default(value = env.HOME ~ '/.ssh') }}"
# Host ssh-agent socket bind-mounted into the nvim/claude containers, so git
# over SSH uses the already-unlocked host key instead of prompting for the
# passphrase every time. Linux: the host's own $SSH_AUTH_SOCK. macOS: the host
# socket can't cross the Docker Desktop VM boundary, so Docker Desktop exposes
# the host agent inside the VM at the fixed path /run/host-services/ssh-auth.sock
# (keys must be in the host agent: ssh-add --apple-use-keychain ~/.ssh/id_rsa).
# Falls back to /dev/null when no agent is running — mounting that keeps the
# containers startable (ssh just reports no agent) instead of failing the whole
# `docker compose up` on an empty mount source.
SSH_AGENT_SOCK = "{% if os() == 'macos' %}/run/host-services/ssh-auth.sock{% else %}{{ env.SSH_AUTH_SOCK | default(value='/dev/null') }}{% endif %}"
# Proxy network subnet and Traefik's static IP on it (worktree extra_hosts
# target). Override both in mise.local.toml when running multiple
# PROJECT_PREFIX workspaces, or the second proxy network will fail to create.
PROXY_SUBNET = "{{env.PROXY_SUBNET | default(value='10.213.0.0/24')}}"
TRAEFIK_IP = "{{env.TRAEFIK_IP | default(value='10.213.0.2')}}"
NVIM_CONFIG_DIR = "{{ env.NVIM_CONFIG_DIR | default(value = env.HOME ~ '/.config/nvim') }}"
# Light/dark mode for the nvim container, read by the Neovim config at startup.
# The container's `nvim --headless --listen` server has no UI attached when it
# starts, so Neovim's builtin OSC 11 background detection is skipped and it would
# otherwise always come up dark. Detected from the host terminal instead; set
# NVIM_BACKGROUND in the environment or mise.local.toml to override.
NVIM_BACKGROUND = "{{ exec(command = config_root ~ '/.scripts/detect-terminal-background.sh') }}"
# CPU limits for the compose services (deploy.resources), as a percentage of
# this machine's cores instead of hardcoded counts — see .scripts/cpu-share.sh.
# Several worktree stacks can be up at once, so no service gets the whole host;
# override these in mise.local.toml to change the split.
CPUS_75 = "{{ exec(command = config_root ~ '/.scripts/cpu-share.sh 75') }}"
CPUS_50 = "{{ exec(command = config_root ~ '/.scripts/cpu-share.sh 50') }}"
CPUS_25 = "{{ exec(command = config_root ~ '/.scripts/cpu-share.sh 25') }}"

[tasks.nvim]
description = "Connect to Neovim in the container."
# No command preview — this task hands the terminal straight to the Neovim UI.
quiet = true
# No `depends = ["up"]` and no readiness polling: the `up` dependency added
# seconds to every attach. This assumes the nvim container is already running —
# if it isn't, `mise run up` first.
#
# NVIM_BACKGROUND is baked into the container's environment when it starts, so a
# server that has been up since before an OS theme flip is stale. Push the
# freshly detected mode in before attaching — mise re-runs the detector on every
# invocation, so this value is current. Best effort: if the server isn't up yet
# the --remote-ui below reports it properly.
# (Comments live out here, not inside `run`: mise echoes the script's first line
# as the command preview, so a leading comment is all you'd see.)
run = """
  if [ -n "${NVIM_BACKGROUND:-}" ]; then
    nvim --server localhost:{{ env.NVIM_PORT }} \
      --remote-expr "v:lua.BackgroundSet('$NVIM_BACKGROUND')" >/dev/null 2>&1 || true
  fi
  nvim --remote-ui --server localhost:{{ env.NVIM_PORT }}
"""
alias = "v"

[tasks.rails]
description = "Enter the running Rails container."
run = "docker compose exec rails /bin/zsh"

[tasks.test]
description = "Run the full local test suite: Rails unit tests then the JavaScript tests. System tests are not included — run 'test:rails_system' for those."
# Not `depends` — mise runs dependencies in parallel, which interleaves the two
# suites' output. An array `run` is sequential and stops at the first failure.
run = [
  "mise run test:rails",
  "mise run test:javascript",
]
alias = "t"

[tasks."test:rails"]
description = "Run the Rails unit tests. Pass any 'rails test' args (files, file:line, -n, --seed, ...) to run a subset."
depends = ["up", "log:trim"]
usage = 'arg "[args]" var=#true help="args forwarded to bin/rails test (e.g. test/models/foo.rb:42, -n /pattern/, --seed 123)"'
run = """
  if docker compose ps --services --filter "status=running" | grep -q '^rails$'; then
    docker compose exec rails bin/rails test $usage_args
  else
    docker compose run --label "traefik.enable=false" --rm rails bin/rails test $usage_args
  fi
"""
alias = "tr"

[tasks."test:rails_watcher"]
description = "Start the Retest runner — reruns the matching Rails test on every file save."
depends = ["up", "log:trim"]
# Having `depends` puts mise in prefixed-output mode, which pipes stdio and kills
# the TTY `-it` needs ("cannot attach stdin to a TTY-enabled container"). `raw`
# hands the terminal straight to the container.
raw = true
# No `docker compose exec` fast path like console/tjw have: quitting the watcher
# takes the rails container down with it. Always a throwaway `run` container.
run = """
  CMD='gem list -i retest > /dev/null 2>&1 || gem install retest && retest --rails'
  # `docker compose run` inherits the rails service's traefik labels + proxy network,
  # so the one-off container registers as a second backend for the worktree host.
  # Traefik then round-robins onto it (nothing on :3000) → 502s. Opt it out.
  docker compose run -e DISABLE_COVERAGE=true --label "traefik.enable=false" --rm -it rails sh -c "$CMD"
"""
alias = "trw"

[tasks."test:rails_system"]
description = "Run the Rails system tests. Pass any 'rails test:system' args (files, file:line, -n, --seed, ...) to run a subset."
depends = ["up", "log:trim"]
usage = 'arg "[args]" var=#true help="args forwarded to the test runner (e.g. test/system/foo_test.rb:42, --seed 123)"'
# `rails test:system` hardcodes the whole test/system dir, so when a specific test
# file is given, run it through the `rails test` runner (which honors explicit paths).
# Otherwise stick with `test:system` so flags like --seed/-n apply to the full suite.
run = """
  case "$usage_args" in
    *_test.rb*) test_target="test $usage_args" ;;
    *)          test_target="test:system $usage_args" ;;
  esac
  if docker compose ps --services --filter "status=running" | grep -q '^rails$'; then
    docker compose exec rails bin/rails $test_target
  else
    docker compose run --label "traefik.enable=false" --rm rails bin/rails $test_target
  fi
"""
alias = "trs"

# The JS tests are Vitest + jsdom — no database, no server, no browser. They only
# need the rails image (node + node_modules), so these tasks deliberately skip
# `depends = ["up"]` and fall back to a one-off container when the stack is down.
[tasks."test:javascript"]
description = "Run the JavaScript (Vitest) tests once. Pass a file path or any vitest args (-t 'name', --reporter, ...) to run a subset."
usage = 'arg "[args]" var=#true help="args forwarded to vitest run (e.g. test/javascript/controllers/foo_controller.test.js, -t sums-the-inputs)"'
run = """
  if docker compose ps --services --filter "status=running" | grep -q '^rails$'; then
    docker compose exec rails npx vitest run $usage_args
  else
    {{config_root}}/.scripts/seed-home.sh "$CURRENT_WORKTREE_NAME"
    docker compose run --label "traefik.enable=false" --rm rails npx vitest run $usage_args
  fi
"""
alias = "tj"

[tasks."test:javascript_watcher"]
description = "Start Vitest in watch mode — the JS TDD loop. Pass a file path or vitest args to narrow what it watches."
usage = 'arg "[args]" var=#true help="args forwarded to vitest (e.g. test/javascript/controllers/foo_controller.test.js)"'
run = """
  if docker compose ps --services --filter "status=running" | grep -q '^rails$'; then
    docker compose exec rails npx vitest $usage_args
  else
    {{config_root}}/.scripts/seed-home.sh "$CURRENT_WORKTREE_NAME"
    docker compose run --label "traefik.enable=false" --rm -it rails npx vitest $usage_args
  fi
"""
alias = "tjw"

[tasks.console]
description = "Enter the Rails console. Any args are forwarded to bin/rails console (e.g. -e production, --sandbox)."
usage = 'arg "[args]" var=#true help="args forwarded to bin/rails console (e.g. -e production, --sandbox)"'
run = """
  if docker compose ps --services --filter "status=running" | grep -q '^rails$'; then
    docker compose exec rails bin/rails console $usage_args
  else
    {{config_root}}/.scripts/seed-home.sh "$CURRENT_WORKTREE_NAME"
    docker compose run -e DISABLE_LOGCRAFT=true --label "traefik.enable=false" --rm -it rails bin/rails console $usage_args
  fi
"""
alias = "c"

[tasks.up]
description = "Start the application."
depends = ["proxy:up"]
run = """
  # Every worktree shares one compose file and separates itself purely through
  # the environment, so a COMPOSE_PROJECT_NAME that disagrees with this worktree
  # yields containers labelled for one worktree but wired to another's source
  # tree and published ports. They then fail to start with "port is already
  # allocated" behind a "failed to set up container networking" prefix, which
  # reads as a network fault and sends you hunting the wrong thing. Refuse to
  # create them instead.
  expected_project="${PROJECT_PREFIX}-${CURRENT_WORKTREE_NAME}"
  if [ "${COMPOSE_PROJECT_NAME:-}" != "$expected_project" ]; then
    echo "COMPOSE_PROJECT_NAME is '${COMPOSE_PROJECT_NAME:-<unset>}' but this worktree is '${expected_project}'." >&2
    echo "Containers would be created for another worktree. Start a fresh shell here and retry." >&2
    exit 1
  fi
  # Seed this worktree's home from the template if missing. Covers master
  # (create-worktree.sh never runs for it) and fresh clones; create-worktree.sh
  # does the same for new worktrees.
  {{config_root}}/.scripts/seed-home.sh "$CURRENT_WORKTREE_NAME"
  for vol in "$GEM_VOLUME"; do
    docker volume inspect "$vol" >/dev/null 2>&1 || docker volume create "$vol" >/dev/null
  done
  # Cross-worktree cache volumes, mounted inside the bind-mounted home. A
  # fresh named volume mounts root-owned and copy-from-image initialization
  # cannot fix that under a bind mount, so chown once at creation — never
  # recursively on an existing volume (warm caches stay untouched).
  for vol in npm_cache npm_global nvim_share playwright_browsers claude_plugins_cache claude_plugins_marketplaces; do
    name="${PROJECT_PREFIX}_${vol}"
    if ! docker volume inspect "$name" >/dev/null 2>&1; then
      docker volume create "$name" >/dev/null
      docker run --rm -v "$name":/v alpine chown "$(id -u):$(id -g)" /v
    fi
  done
  # PLAYWRIGHT_VERSION is derived from this worktree's Gemfile.lock
  # (.scripts/playwright-version.sh via mise.local.toml). When it resolves,
  # image + playwright-core + gem stay in lockstep automatically; when empty
  # the playwright image falls back to a default tag that can drift.
  if [ -z "${PLAYWRIGHT_VERSION:-}" ]; then
    echo "WARN: PLAYWRIGHT_VERSION not derived from Gemfile.lock — playwright image uses its fallback tag and may drift from the gem (older mise.local.toml? re-render from .mise/local.toml.template)" >&2
  fi
  # Stopped containers pin network IDs, so a network that was recreated or
  # pruned while unused leaves them failing with "network <id> not found" —
  # prune them so compose recreates them attached to the current networks. Same
  # for containers mounting another worktree's source: they publish that
  # worktree's ports and collide with it. See the script for both cases.
  {{config_root}}/.scripts/prune-stale-containers.sh
  docker compose up -d
"""
alias = "u"

[tasks.pull]
description = "Refresh the third-party images (postgres, redis, rustfs). Skips rails/nvim/claude/playwright — those are built locally, never pushed, so a plain 'docker compose pull' fails on them with 'pull access denied for filial/...'. Run from a worktree."
run = "docker compose pull --ignore-buildable"
alias = "p"

[tasks.build]
description = "Rebuild the locally built images (rails, nvim, claude, playwright) against fresh BASE images — --pull re-fetches the ruby/node/debian FROM layers instead of reusing stale cached ones. Run from a worktree."
run = "docker compose build --pull"
alias = "b"

[tasks."proxy:up"]
description = "Start the shared Traefik reverse proxy (one stack, all worktrees)."
alias = "proxy"
run = """
  COMPOSE_PROJECT_NAME=${PROJECT_PREFIX}-proxy \
  docker compose -f {{config_root}}/.docker-config/proxy/compose.yml up -d
"""

[tasks."proxy:pull"]
description = "Pull updated proxy images (traefik, dozzle, nginx) and recreate the proxy stack with them. All three are registry images, so no --ignore-buildable needed here."
run = """
  COMPOSE_PROJECT_NAME=${PROJECT_PREFIX}-proxy \
  docker compose -f {{config_root}}/.docker-config/proxy/compose.yml pull
  COMPOSE_PROJECT_NAME=${PROJECT_PREFIX}-proxy \
  docker compose -f {{config_root}}/.docker-config/proxy/compose.yml up -d
"""

[tasks."proxy:down"]
description = "Stop the shared Traefik reverse proxy."
run = """
  COMPOSE_PROJECT_NAME=${PROJECT_PREFIX}-proxy \
  docker compose -f {{config_root}}/.docker-config/proxy/compose.yml down
"""

[tasks."proxy:logs"]
description = "Tail logs from the Traefik proxy."
run = """
  COMPOSE_PROJECT_NAME=${PROJECT_PREFIX}-proxy \
  docker compose -f {{config_root}}/.docker-config/proxy/compose.yml logs -f
"""

[tasks.ci]
description = "Run the CI linting and tests."
run = """
  {{config_root}}/.scripts/seed-home.sh "$CURRENT_WORKTREE_NAME"
  docker compose run --label "traefik.enable=false" rails bundle exec rake ci:build:commit
"""

[tasks.wt]
description = "Create a worktree: mise run wt <branch|PR#|new-branch-name>"
usage = 'arg "<branch>" help="existing branch name, PR number, or new branch name"'
run = '{{config_root}}/.scripts/create-worktree.sh "$usage_branch"'

[tasks."wt:ls"]
description = "List all worktrees"
run = "{{config_root}}/.scripts/list-worktrees.sh"

[tasks."wt:open"]
description = "Open the current worktree URL in a browser. Pass a browser binary name (e.g. firefox) to override xdg-open."
usage = 'arg "[browser]" help="optional browser binary; defaults to xdg-open"'
run = """
  url="http://${WORKTREE_HOST}"
  browser="${usage_browser:-}"
  if [ -n "$browser" ]; then
    if ! command -v "$browser" >/dev/null 2>&1; then
      echo "Error: '$browser' not found in PATH" >&2
      exit 1
    fi
    exec "$browser" "$url"
  fi
  if ! command -v xdg-open >/dev/null 2>&1; then
    echo "xdg-open not found. Pass a browser binary: mise run wt:open firefox" >&2
    exit 1
  fi
  exec xdg-open "$url"
"""

[tasks."log:trim"]
description = "Truncate any worktree log over 100 MB. log/test.log is appended by every test run and never rotated."
# Truncate, not delete: a container may hold the file open, and unlinking it
# would leave the writer filling an inode nothing can see. Sweeps every
# worktree, so a stale one you no longer test still gets reclaimed.
run = "find {{config_root}}/*/log -maxdepth 1 -name '*.log' -size +100M -exec truncate -s 0 {} + 2>/dev/null || true"

[tasks."wt:share"]
description = "Expose this worktree (app + S3) over the tailnet for phone testing. One worktree at a time."
run = '{{config_root}}/.scripts/share-worktree.sh on'

[tasks."wt:unshare"]
description = "Stop sharing this worktree over the tailnet."
run = '{{config_root}}/.scripts/share-worktree.sh off'

[tasks."db:dump"]
description = "Dump the development database and RustFS data for faster container setup."
run = """
  DUMP_DIR="{{ config_root }}/.docker-config/db-dumps"
  mkdir -p "$DUMP_DIR"
  : "${DEV_DB_NAME:?DEV_DB_NAME is empty — could not parse it from config/database.yml; set it manually in mise.local.toml}"
  docker compose exec -T db pg_dump -Fc -U postgres "$DEV_DB_NAME" \
    > "$DUMP_DIR/$DEV_DB_NAME.dump"
  echo "DB dump saved."
  docker run --rm \
    -v "${COMPOSE_PROJECT_NAME}_rustfs_data:/data:ro" \
    -v "$DUMP_DIR:/backup" \
    alpine tar czf /backup/rustfs_data.tar.gz -C /data .
  echo "RustFS dump saved."
  echo "All dumps saved to $DUMP_DIR"
"""

[tasks."db:dump:clear"]
description = "Remove all dump files so the next container start does a full db:prepare."
run = """
  DUMP_DIR="{{ config_root }}/.docker-config/db-dumps"
  rm -f "$DUMP_DIR"/*.dump "$DUMP_DIR"/*.sql "$DUMP_DIR"/*.sql.gz "$DUMP_DIR"/rustfs_data.tar.gz
  echo "Cleared all dump files from $DUMP_DIR"
"""

[tasks.claude]
description = "Run Claude AI assistant in the current terminal window. Set CLAUDE_NEW_TERM=1 (or run claude:newterm) to open it in a new terminal tab instead."
usage = 'arg "[args]…" var=#true default=""'
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  set -- $args
  {{config_root}}/.scripts/seed-home.sh "$CURRENT_WORKTREE_NAME"
  case "${CLAUDE_NEW_TERM:-}" in
    ""|0|false|no) exec docker compose run --rm claude "$@" ;;
  esac
  exec ./.scripts/claude-newterm.sh "$@"
"""
alias = "ai"

[tasks."claude:rebuild"]
description = "Rebuild the Claude container with the latest Claude Code version."
run = "docker compose build --build-arg UPDATE_CLAUDE_CODE=$(date +%s) claude"

[tasks."claude:template:promote"]
description = "Promote this worktree's Claude config set (agents, hooks, skills, settings, plugin records) to the template that seeds new worktrees. Merges plugin records unless --replace; pass a worktree name to promote another worktree."
usage = 'arg "[args]…" var=#true default=""'
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  set -- $args
  case "${1:-}" in
    ""|-*) set -- "$CURRENT_WORKTREE_NAME" "$@" ;;
  esac
  exec {{config_root}}/.scripts/sync-claude-template.sh promote "$@"
"""

[tasks."claude:template:apply"]
description = "Copy the template's Claude config set onto this worktree's home (or --all for every home). Never touches credentials, sessions or other state."
usage = 'arg "[args]…" var=#true default=""'
run = """
  args="${usage_args:-}"
  [ "$args" = "''" ] && args=
  set -- $args
  case "${1:-}" in
    ""|-*) set -- "$CURRENT_WORKTREE_NAME" "$@" ;;
  esac
  case "$*" in
    *--all*) set -- --all $(printf '%s\\n' "$@" | grep -v -e "^$CURRENT_WORKTREE_NAME$" -e "^--all$" | tr '\\n' ' ') ;;
  esac
  exec {{config_root}}/.scripts/sync-claude-template.sh apply "$@"
"""

[tasks.clean]
description = "Remove docker containers, networks, volumes and images belonging to worktrees that no longer exist. Lists what it found and asks before deleting. Leaves live worktrees and the shared base images alone."
run = "{{config_root}}/.scripts/clean-orphan-docker-artifacts.sh"

[tasks.destroy]
description = "Remove all docker resources (containers, networks, volumes, images) for this project and delete the project folder."
run = """
  set -e
  prefix="$PROJECT_PREFIX"
  [ -z "$prefix" ] && { echo "PROJECT_PREFIX is unset; refusing to destroy" >&2; exit 1; }
  if [ -f .mise/config.toml ]; then
    target=$(pwd)
  elif [ -f ../.mise/config.toml ]; then
    target=$(cd .. && pwd)
  else
    echo "Not at project root or a worktree; refusing to destroy" >&2
    exit 1
  fi
  cd "$HOME"
  # [-_] catches containers/volumes/networks (filial-*, filial_*);
  # / catches the shared image repos (filial/rails, filial/claude, ...).
  pattern="^${prefix}[-_/]"

  echo "This will remove:"
  echo "  - All docker containers/networks/volumes/images matching ${pattern}"
  echo "  - The project folder: ${target}"
  printf "Type 'destroy' to confirm: "
  read -r confirm
  [ "$confirm" = "destroy" ] || { echo "Aborted."; exit 1; }

  containers=$(docker ps -a --format '{% raw %}{{.Names}}{% endraw %}' | grep -E "$pattern" || true)
  if [ -n "$containers" ]; then
    echo "Removing containers:"; for x in $containers; do echo "  $x"; done
    echo "$containers" | xargs docker rm -f >/dev/null
  fi

  networks=$(docker network ls --format '{% raw %}{{.Name}}{% endraw %}' | grep -E "$pattern" || true)
  if [ -n "$networks" ]; then
    echo "Removing networks:"; for x in $networks; do echo "  $x"; done
    echo "$networks" | xargs docker network rm >/dev/null
  fi

  volumes=$(docker volume ls --format '{% raw %}{{.Name}}{% endraw %}' | grep -E "$pattern" || true)
  if [ -n "$volumes" ]; then
    echo "Removing volumes:"; for x in $volumes; do echo "  $x"; done
    echo "$volumes" | xargs docker volume rm >/dev/null
  fi

  images=$(docker images --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}' | grep -E "$pattern" || true)
  if [ -n "$images" ]; then
    echo "Removing images:"; for x in $images; do echo "  $x"; done
    echo "$images" | xargs docker rmi -f >/dev/null
  fi

  echo "Removing project folder: ${target}"
  rm -rf "$target"

  echo ""
  echo "Done. Your shell may be in a removed directory; run: cd ~"
"""

[tasks.down]
description = "Tear down the current worktree's docker resources, including its volumes (keeps the worktree folder and built images). Run from a worktree."
run = """
  set -e
  echo "This removes this worktree's containers AND its volumes (database data will be lost)."
  echo "To only stop the containers, run 'mise run stop' instead."
  printf "Continue? [y/N] "
  read -r confirm
  case "$confirm" in
    y|Y|yes|YES) ;;
    *) echo "Aborted."; exit 1 ;;
  esac

  docker compose down --volumes --remove-orphans
"""

[tasks.stop]
description = "Stop the current worktree's containers without removing them or their volumes (unlike 'down'). Resume with 'mise run up'. Leaves the shared proxy running. Run from a worktree."
run = "docker compose stop"
alias = "s"
