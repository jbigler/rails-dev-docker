# Serves the wt.localhost dashboard plus the claude session-status drop zone.
# /status/ autoindexes as JSON so the dashboard can discover which worktrees
# have (or had) a claude session without knowing the slugs up front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate on every load (ETag makes it a cheap 304) — without this,
    # browsers heuristically cache the dashboard and render stale HTML long
    # after a redeploy.
    location = / {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /status/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store";
    }
}
